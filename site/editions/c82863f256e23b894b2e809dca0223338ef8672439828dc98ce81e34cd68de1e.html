const builtins={anyType:'Допускаются текст, вложенные элементы и атрибуты. Известные объявления проверяются по XSD.',boolean:'Логическое значение: true, false, 1 или 0.',date:'Дата XML Schema, например 2026-09-19.',long:'Целое число от −9223372036854775808 до 9223372036854775807.',integer:'Целое число.',decimal:'Десятичное число. Разделитель дробной части — точка.',int:'Целое число от −2147483648 до 2147483647.'};

function valueRules(field){
 const rules=(field.facets||[]).filter(([key])=>key!=='pattern'||!field.patternGroups);
 if(field.patternGroups)rules.push(['Шаблоны XSD',field.patternGroups.map(group=>'('+group.map(pattern=>'«'+pattern+'»').join(' ИЛИ ')+')').join(' И ')]);
 return [...rules,...Object.entries(field.flags||{})];
}

function renderFieldReviews(field){
 const matches=reviewsByPath.get(field.path)||[];
 const direct=matches.filter(({finding})=>finding.field_link_scope!=='parent');
 const children=matches.filter(({finding})=>finding.field_link_scope==='parent');
 for(const [label,group] of [['Замечания к полю',direct],['Замечания к дочерним полям',children]]){
  if(!group.length)continue;
  const section=el('section','field-reviews');section.setAttribute('aria-label',label);
  section.append(el('h3','',label+' · '+group.length));
  for(const {source,finding} of group){
   const item=el('article','field-review');item.append(el('h4','',finding.kind));
   const origin=el('p','quiet'),caption=source.name+(source.version?' · версия '+source.version:'')+(source.date?' · '+source.date:'');
   if(source.url||source.download){const a=el('a','',caption);a.href=source.url||'../'+source.download;a.target='_blank';a.rel='noopener';origin.append(a)}
   else origin.append(el('span','',caption));
   if(source.url&&source.download){const saved=el('a','','Скачать DOCX');saved.href='../'+source.download;origin.append(document.createTextNode(' · '),saved)}
   item.append(origin);
   const evidence=el('dl','');
   for(const [label,value] of [['В спецификации',finding.spec],['В XSD',finding.xsd],['Последствие',finding.impact],['Место в спецификации',finding.location],['Место в XSD',finding.xlocation]]){
    if(value)evidence.append(el('dt','',label),el('dd','',value));
   }
   item.append(evidence);section.append(item);
  }
  detail.append(section);
 }
}
function typeLabel(field,fallback){return field.type||field.base||(field.listItem?'Список значений':fallback)}
function renderTypeOption(type,label,container){
 const box=el('div','value');
 box.append(el('b','',label+' · '+typeLabel(type,'Составной тип')));
 const rules=el('ul','rules');
 for(const [key,value] of valueRules(type))rules.append(el('li','',(facets[key]||key)+': '+value));
 for(const [value,doc] of type.values||[])rules.append(el('li','',(value===''?'«пустая строка»':value)+(doc?' · '+doc:'')));
 if(rules.children.length)box.append(rules);
 renderTypeOptions(type,box);
 container.append(box);
}
function renderTypeOptions(field,container){
 if(field.listItem)renderTypeOption(field.listItem,'Тип элемента списка',container);
 for(const [i,option] of (field.alternatives||[]).entries())renderTypeOption(option,'Вариант '+(i+1),container);
}
function renderDetail(){const f=fields[current],inChoice=/Выбор \d+, вариант \d+/.test(f.group||'');detail.replaceChildren();const ancestors=[];for(let p=f.parent;p>=0;p=fields[p].parent)ancestors.unshift(p);
 const nav=el('div','breadcrumbs');ancestors.forEach(i=>nav.append(button('crumb',fields[i].name,()=>select(i,true)),document.createTextNode(' / ')));detail.append(nav);
 const kind={attribute:'Атрибут',any:'Расширение для элементов',anyAttribute:'Расширение для атрибутов'}[f.kind]||(f.children.length?'Блок':'Поле');
 const title=el('div','title');title.append(el('h2','',f.name),el('span','pill',kind));detail.append(title);
 if(f.doc)detail.append(el('p','doc',f.doc));const path=el('div','pathbox'),copy=button('btn','Копировать путь',async()=>{try{await navigator.clipboard.writeText(f.path);copy.textContent='Скопировано'}catch{const range=document.createRange();range.selectNodeContents(path.firstChild);const sel=getSelection();sel.removeAllRanges();sel.addRange(range);copy.textContent='Нажмите Ctrl+C'}});path.append(el('code','',f.path),copy);detail.append(path);
 const facts=el('div','facts');for(const [label,val] of [['Тип',typeLabel(f,f.flags.mixed==='true'?'Смешанный составной тип':f.contentModel?.[0]==='empty'?'Пустой составной тип':f.children.length?'Составной':'По схеме')],['Кратность',f.min+' … '+(f.max==='unbounded'?'∞':f.max)],['В родительском блоке',inChoice?'Вариант выбора':f.min==='0'?'Необязательно':f.parent<0?'Корень':f.group?'Обязательно внутри блока':'Обязательно']]){const a=el('div','fact');a.append(el('span','label',label),el('b','',val));facts.append(a)}detail.append(facts);renderFieldReviews(f);
 const req=valueRules(f),base=builtins[f.base.split(':').pop()];
 if(req.length||base||f.group){detail.append(el('h3','','Ограничения ввода'));const ul=el('ul','rules');if(base)ul.append(el('li','',base));if(f.group)ul.append(el('li','',''+f.group+(inChoice?'. Поля с одинаковым номером варианта входят в него вместе. Кратность указана внутри варианта.':'. Кратность группы относится ко всему блоку. При наличии блока его поля заполняются вместе с учётом кратности каждого поля.')));for(const [k,v] of req){const li=el('li','',(facets[k]||k)+': ');li.append(el('code','',v));ul.append(li)}detail.append(ul)}
 const conditions=ancestors.filter(i=>/обязател|необходимо|при указании|при условии/i.test(fields[i].doc));if(conditions.length){detail.append(el('h3','','Условия родительских блоков'));conditions.forEach(i=>detail.append(el('p','quiet',fields[i].name+' · '+fields[i].doc)))}
 if(f.alternatives?.length)detail.append(el('h3','','Допустимые варианты типа (union)'),el('p','quiet','Значение должно соответствовать хотя бы одному варианту. Ограничения разных вариантов не объединяются.'));
 renderTypeOptions(f,detail);
 if(f.values.length){detail.append(el('h3','','Допустимые значения · '+f.values.length));for(const [v,n] of f.values){const r=el('div','value');r.append(el('code','',v||'«»'),el('span','',n));detail.append(r)}}
 if(f.children.length){
  detail.append(el('h3','','Состав блока'));
  const order={all:'Дочерние элементы можно указывать в любом порядке (xs:all).',sequence:'Порядок дочерних элементов и групп задан последовательностью XSD (xs:sequence).',choice:'Для каждого вхождения группы заполняется один из вариантов (xs:choice).'}[f.contentModel?.[0]];
  if(order)detail.append(el('p','quiet',order));
  const list=el('div','children');for(const i of f.children){const n=fields[i],b=button('child','',()=>select(i,true));b.append(el('b','',n.name),el('small','',(n.group?n.group+' · ':'')+(n.doc||n.type||'Элемент схемы')));list.append(b)}detail.append(list);
 }
 const wildcard=f.kind==='any'||f.kind==='anyAttribute';
 const namespace=wildcard?(f.wildcardNamespace||f.flags.namespace||'##any'):(f.ns||'без пространства имён');
 const description=wildcard?'Допустимые пространства имён: '+(namespace==='##any'?'любые (##any)':namespace):'Пространство имён: '+namespace;
 const d=el('details','');d.append(el('summary','','Источник в XSD'),el('p','quiet','Объявление: '+f.file+(f.typeFile?' · Тип: '+f.typeFile:'')),el('p','quiet',description),el('p','quiet','Архив: '+data.archive),el('p','quiet','SHA-256: '+data.sha256));detail.append(d);
 if(query.value)detail.append(button('btn','Показать в дереве',()=>select(current,true)));
}
function render(){renderTree();renderDetail()}
onlyReviews.onchange=()=>{
 if(onlyReviews.checked){
  reviewExpanded.clear();
  for(const i of reviewTree)if(!reviewCounts[i]||fields[i].children.length)reviewExpanded.add(i);
  const terms=normalize(query.value.trim()).split(/\s+/).filter(Boolean);
  const matches=fields.map((f,i)=>i).filter(i=>reviewCounts[i]&&inScope(i)&&terms.every(t=>index[i].includes(t)));
  if(matches.length&&!matches.includes(current))select(matches[0]);else render();
 }else{
  for(let p=fields[current].parent;p>=0;p=fields[p].parent)expanded.add(p);
  render();
 }
 tree.scrollTop=0;
};
query.oninput=()=>{render();tree.scrollTop=0};scope.onchange=()=>{if(scope.value){const next=branches.find(i=>fields[i].path===scope.value);expanded.add(next);select(next)}else render();tree.scrollTop=0};
$('reset').onclick=()=>{query.value='';scope.value='';onlyReviews.checked=false;reviewExpanded.clear();expanded.clear();expanded.add(0);select(0);tree.scrollTop=0};render();

function restoreField(){
 const path=new URLSearchParams(location.hash.slice(1)).get('field');
 const idx=path===null?0:fields.findIndex(f=>f.path===path);
 if(idx>=0&&idx!==current)select(idx,true,false)
}
window.addEventListener('message',event=>{
 if(event.source!==parent||event.origin!==location.origin||event.data?.type!=='sedo-select-field'||event.data.revision!==data.revision||typeof event.data.path!=='string')return;
 const idx=fields.findIndex(f=>f.path===event.data.path);if(idx>=0)select(idx,true);
});
window.addEventListener('hashchange',()=>{restoreField();if(parent!==window)parent.postMessage({type:'sedo-field',revision:data.revision,path:location.hash?fields[current].path:null},'*')});
restoreField();
</script></html>
