01","file":"Benefit1.xsd","flags":{"nillable":"true"}},{"name":"calcCondition","path":"approveSocialAssist/benefit1Approve/calculationData/calcConditionList/calcCondition","parent":139,"group":"","doc":"Условия исчисления. При указании кода 43 необходимо заполнить причину радиационного воздействия","kind":"element","min":"1","max":"3","type":"","base":"xs:string","facets":[],"values":[["43","\"В соответствии с Федеральными законами от 26 ноября 1998г. № 175-ФЗ \"\"О социальной защите граждан Российской Федерации, подвергшихся воздействию радиации вследствие аварии в 1957 году на производственном объединении \"\"Маяк\"\" и сбросов радиоактивных отходов в реку Теча\"\" и от 10 января 2002г. № 2-ФЗ \"\"О социальных гарантиях гражданам, подвергшимся радиационному воздействию вследствие ядерных испытаний на Семипалатинском полигоне\"\", Законом Российской Федерации от 15 мая 1991г. № 1244-1 \"\"О социальной защите граждан, подвергшихся воздействию радиации вследствие катастрофы на Чернобыльской АЭС\"\", постановлением Правительства Российской Федерации от 30 марта 1993г. № 253 \"\"О порядке предоставления компенсаций и льгот лицам, пострадавшим от радиационных воздействий\"\", постановлением Верховного Совета Российской Федерации от 27 декабря 1991г. № 2123-1 \"\"О распространении действия Закона РСФСР \"\"О социальной защите граждан, подвергшихся воздействию радиации вследствие катастрофы на Чернобыльской АЭС на граждан из подразделений особого риска\"\" получатель пособия по временной нетрудоспособности или по беременности и родам имеет право на льготы при назначении и исчислении соответствующего вида пособия\""],["44","Получатель пособия по временной нетрудоспособности приступил к работе в районах Крайнего Севера и приравненных к ним местностях до 2007г. и продолжает работать в данных местностях."],["45","На момент наступления временной нетрудоспособности получатель пособия по временной нетрудоспособности имеет группу инвалидности"],["46","На момент наступления временной нетрудоспособности с получателем заключен трудовой договор (служебный контракт) или договор гражданско-правового характера на срок менее 6 месяцев. Данный код не проставляется в случае указания кода \"11\" в строке \"Причина нетрудоспособности\""],["47","\"Заболевание или травма у получателя пособия по временной нетрудоспособности наступили в течение 30 календарных дней после прекращения работы по трудовому договору, служебной или иной деятельности, в течение которой он подлежит обязательному социальному страхованию.\""],["48","При уважительной причине нарушения режима (в случае если в строке \"Отметки о нарушении режима\" проставлен соответствующий код)"],["49","\"В случае если продолжительность заболевания превышает 4 месяца подряд, - для застрахованных лиц, имеющих инвалидность на день наступления страхового случая. Данный код не проставляется в случае указания кода \"\"11\"\" в строке \"\"Причина нетрудоспособности\"\";\""],["50","В случае если продолжительность заболевания превышает 5 месяцев в календарном году, - для застрахованных лиц, имеющих инвалидность на день наступления страхового случая. Данный код не проставляется в случае указания кода \"11\" в строке \"Причина нетрудоспособности\""],["51","В случае, указанном в части 1.1. статьи 14 Федерального закона от 29 декабря 2006 г. № 255-ФЗ \"Об обязательном социальном страховании на случай временной нетрудоспособности и в связи с материнством\", когда застрахованное лицо на момент наступления страхового случая работает на условиях неполного рабочего времени (неполной рабочей недели, неполного рабочего дня)"],["52","Аннулирование трудового договора."]],"children":[141,142],"ns":"urn:ru:fss:integration:types:proactive:benefit1:v01","file":"Benefit1.xsd","flags":{},"typeFile":"ConditionsCalc.xsd"},{"name":"@editable","path":"approveSocialAssist/benefit1Approve/calculationData/calcConditionList/calcCondition/@editable","parent":140,"group":"","doc":"Атрибут указывающий, что значение элемента может быть изме подвергшихся воздействию радиации вследствие катастрофы на Чернобыльской АЭС на граждан из подразделений особого риска\"\" получатель пособия по временной нетрудоспособности или по беременности и родам имеет право на льготы при назначении и исчислении соответствующего вида пособия\""],["44","Получатель пособия по временной нетрудоспособности приступил к работе в районах Крайнего Севера и приравненных к ним местностях до 2007г. и продолжает работать в данных местностях."],["45","На момент наступления временной нетрудоспособности получатель пособия по временной нетрудоспособности имеет группу инвалидности"],["46","На момент наступления временной нетрудоспособности с получателем заключен трудовой договор (служебный контракт) или договор гражданско-правового характера на срок менее 6 месяцев. Данный код не проставляется в случае указания кода \"11\" в строке \"Причина нетрудоспособности\""],["47","\"Заболевание или травма у получателя пособия по временной нетрудоспособности наступили в течение 30 календарных дней после прекращения работы по трудовому договору, служебной или иной деятельности, в течение которой он подлежит обязательному социальному страхованию.\""],["48","При уважительной причине нарушения режима (в случае если в строке \"Отметки о нарушении режима\" проставлен соответствующий код)"],["49","\"В случае если продолжительность заболевания превышает 4 месяца подряд, - для застрахованных лиц, имеющих инвалидность на день наступления страхового случая. Данный код не проставляется в случае указания кода \"\"11\"\" в строке \"\"Причина нетрудоспособности\"\";\""],["50","В случае если продолжительность заболевания превышает 5 месяцев в календарном году, - для застрахованных лиц, имеющих инвалидность на день наступления страхового случая. Данный код не проставляется в случае указания кода \"11\" в строке \"Причина нетрудоспособности\""],["51","В случае, указанном в части 1.1. статьи 14 Федерального закона от 29 декабря 2006 г. № 255-ФЗ \"Об обязательном социальном страховании на случай временной нетрудоспособности и в связи с материнством\", когда застрахованное лицо на момент наступления страхового случая работает на условиях неполного рабочего времени (неполной рабочей недели, неполного рабочего дня)"],["52","Аннулирование трудового договора."]],"children":[343,344],"ns":"urn:ru:fss:integration:types:proactive:benefit2:v01","file":"Benefit2.xsd","flags":{},"typeFile":"ConditionsCalc.xsd"},{"name":"@editable","path":"approveSocialAssist/benefit2Approve/calculationData/calcConditionList/calcCondition/@editable","parent":342,"group":"","doc":"Атрибут указывающий, что значение элемента может быть изменено в ответе","kind":"attribute","min":"0","max":"1","type":"xs:boolean","base":"xs:boolean","facets":[],"values":[],"children":[],"ns":"","file":"Confirmation.xsd","flags":{}},{"name":"@required","path":"approveSocialAssist/benefit2Approve/calculationData/calcConditionList/calcCondition/@required","parent":342,"group":"","doc":"Атрибут указывающий, что наличие значения обязательно (not null) в ответе","kind":"attribute","min":"0","max":"1","type":"xs:boolean","base":"xs:boolean","facets":[],"values":[],"children":[],"ns":"","file":"Confirmation.xsd","flags":{}},{"name":"causeRadiation","path":"approveSocialAssist/benefit2Approve/calculationData/causeRadiation","parent":307,"group":"","doc":"Причина воздействия радиации. При указании причины радиации необходимо заполнить условия исчисления: код 43","kind":"element","min":"0","max":"1","type":"r:CauseRadiationExposureType","base":"xs:string","facets":[],"values":[["1","ЧАЭС"],["2","Семипалатинск"],["3","Маяк"],["4","Граждане из подразделений особого риска"]],"children":[],"ns":"urn:ru:fss:integration:types:proactive:benefit2:v01","file":"Benefit2.xsd","flags":{},"typeFile":"CauseRadiationExposure.xsd"},{"name":"assignmentParams","path":"approveSocialAssist/benefit2Approve/assignmentParams","parent":205,"group":"","doc":"Параметры назначения и выплаты пособия. В случае, если в сооб Правительства Российской Федерации от 30 марта 1993г. № 253 \"\"О порядке предоставления компенсаций и льгот лицам, пострадавшим от радиационных воздействий\"\", постановлением Верховного Совета Российской Федерации от 27 декабря 1991г. № 2123-1 \"\"О распространении действия Закона РСФСР \"\"О социальной защите граждан, подвергшихся воздействию радиации вследствие катастрофы на Чернобыльской АЭС на граждан из подразделений особого риска\"\" получатель пособия по временной нетрудоспособности или по беременности и родам имеет право на льготы при назначении и исчислении соответствующего вида пособия\""],["44","Получатель пособия по временной нетрудоспособности приступил к работе в районах Крайнего Севера и приравненных к ним местностях до 2007г. и продолжает работать в данных местностях."],["45","На момент наступления временной нетрудоспособности получатель пособия по временной нетрудоспособности имеет группу инвалидности"],["46","На момент наступления временной нетрудоспособности с получателем заключен трудовой договор (служебный контракт) или договор гражданско-правового характера на срок менее 6 месяцев. Данный код не проставляется в случае указания кода \"11\" в строке \"Причина нетрудоспособности\""],["47","\"Заболевание или травма у получателя пособия по временной нетрудоспособности наступили в течение 30 календарных дней после прекращения работы по трудовому договору, служебной или иной деятельности, в течение которой он подлежит обязательному социальному страхованию.\""],["48","При уважительной причине нарушения режима (в случае если в строке \"Отметки о нарушении режима\" проставлен соответствующий код)"],["49","\"В случае если продолжительность заболевания превышает 4 месяца подряд, - для застрахованных лиц, имеющих инвалидность на день наступления страхового случая. Данный код не проставляется в случае указания кода \"\"11\"\" в строке \"\"Причина нетрудоспособности\"\";\""],["50","В случае если продолжительность заболевания превышает 5 месяцев в календарном году, - для застрахованных лиц, имеющих инвалидность на день наступления страхового случая. Данный код не проставляется в случае указания кода \"11\" в строке \"Причина нетрудоспособности\""],["51","В случае, указанном в части 1.1. статьи 14 Федерального закона от 29 декабря 2006 г. № 255-ФЗ \"Об обязательном социальном страховании на случай временной нетрудоспособности и в связи с материнством\", когда застрахованное лицо на момент наступления страхового случая работает на условиях неполного рабочего времени (неполной рабочей недели, неполного рабочего дня)"],["52","Аннулирование трудового договора."]],"children":[943,944],"ns":"urn:ru:fss:integration:types:proactive:benefit6:v01","file":"Benefit6.xsd","flags":{},"typeFile":"ConditionsCalc.xsd"},{"name":"@editable","path":"approveSocialAssist/benefit6Approve/calculationData/calcConditionList/calcCondition/@editable","parent":942,"group":"","doc":"Атрибут указывающий, что значение элемента может быть изменено в ответе","kind":"attribute","min":"0","max":"1","type":"xs:boolean","base":"xs:boolean","facets":[],"values":[],"children":[],"ns":"","file":"Confirmation.xsd","flags":{}},{"name":"@required","path":"approveSocialAssist/benefit6Approve/calculationData/calcConditionList/calcCondition/@required","parent":942,"group":"","doc":"Атрибут указывающий, что наличие значения обязательно (not null) в ответе","kind":"attribute","min":"0","max":"1","type":"xs:boolean","base":"xs:boolean","facets":[],"values":[],"children":[],"ns":"","file":"Confirmation.xsd","flags":{}},{"name":"causeRadiation","path":"approveSocialAssist/benefit6Approve/calculationData/causeRadiation","parent":907,"group":"","doc":"Причина воздействия радиации. При указании причины радиации необходимо заполнить условия исчисления: код 43","kind":"element","min":"0","max":"1","type":"r:CauseRadiationExposureType","base":"xs:string","facets":[],"values":[["1","ЧАЭС"],["2","Семипалатинск"],["3","Маяк"],["4","Граждане из подразделений особого риска"]],"chil "use strict";
const data=JSON.parse(document.querySelector('#catalog').textContent), fields=data.fields;

const alternativeText=rows=>(rows||[]).flatMap(r=>[r.type||'',r.base||'',...(r.values||[]).flat(),...alternativeText(r.alternatives)]);
const index=fields.map(f=>normalize([f.name,f.path,f.doc,...f.values.flat(),...alternativeText(f.alternatives)].join(' ')));

function renderTree(){
 tree.replaceChildren();const terms=normalize(query.value.trim()).split(/\s+/).filter(Boolean);
 if(terms.length){
 const hits=fields.map((f,i)=>i).filter(i=>inScope(i)&&terms.every(t=>index[i].includes(t)));
 const score=i=>terms.reduce((s,t)=>s+(normalize(fields[i].name)===t?6:normalize(fields[i].name).includes(t)?3:normalize(fields[i].doc).includes(t)?1:0),0);
 hits.sort((a,b)=>score(b)-score(a));$('status').textContent='Найдено: '+hits.length;
 for(const i of hits){const f=fields[i],b=button('result'+(i===current?' active':''),'',()=>select(i));b.append(el('b','',f.name),el('small','',f.path),el('small','',f.doc.slice(0,140)));tree.append(b)}
 if(!hits.length)tree.append(el('p','empty','Совпадений нет. Попробуйте часть названия или описания.'));return}
 $('status').textContent='Структура сообщения';
 function row(i,depth){const f=fields[i],r=el('div','item'+(current===i?' active':''));r.style.setProperty('--depth',depth);

 const b=button('name',f.name,()=>select(i));b.title=f.doc||f.path;r.append(b);tree.append(r);if(expanded.has(i))f.children.forEach(n=>row(n,depth+1))}
 if(scope.value)row(branches.find(i=>fields[i].path===scope.value),0);else row(0,0);
}

 if(f.alternatives?.length){
  detail.append(el('h3','','Допустимые варианты типа (union)'),el('p','quiet','Значение должно соответствовать хотя бы одному варианту. Ограничения разных вариантов не объединяются.'));
  function showAlternatives(rows,container){for(const [i,option] of rows.entries()){const box=el('div','value');box.append(el('b','','Вариант '+(i+1)+' · '+(option.type||option.base||'Составной тип')));const rules=el('ul','rules');for(const [k,v] of [...(option.facets||[]),...Object.entries(option.flags||{})])rules.append(el('li','',(facets[k]||k)+': '+v));for(const [value,doc] of option.values||[])rules.append(el('li','',(value===''?'«пустая строка»':value)+(doc?' · '+doc:'')));box.append(rules);if(option.alternatives)showAlternatives(option.alternatives,box);container.append(box)}}
  showAlternatives(f.alternatives,detail);
 }
 if(f.values.length){detail.append(el('h3','','Допустимые значения · '+f.values.length));for(const [v,n] of f.values){const r=el('div','value');r.append(el('code','',v||'«»'),el('span','',n));detail.append(r)}}
 if(f.children.length){detail.append(el('h3','','Состав блока'));const list=el('div','children');for(const i of f.children){const n=fields[i],b=button('child','',()=>select(i,true));b.append(el('b','',n.name),el('small','',(n.group?n.group+' · ':'')+(n.doc||n.type||'Элемент схемы')));list.append(b)}detail.append(list)}
 const d=el('details','');d.append(el('summary','','Источник в XSD'),el('p','quiet','Объявление: '+f.file+(f.typeFile?' · Тип: '+f.typeFile:'')),el('p','quiet','Пространство имён: '+(f.ns||'без пространства имён')),el('p','quiet','Архив: '+data.archive),el('p','quiet','SHA-256: '+data.sha256));detail.append(d);
 if(query.value)detail.append(button('btn','Показать в дереве',()=>select(current,true)));
}
function render(){renderTree();renderDetail()}
query.oninput=()=>{render();tree.scrollTop=0};scope.onchange=()=>{if(scope.value){const next=branches.find(i=>fields[i].path===scope.value);expanded.add(next);select(next)}else render();tree.scrollTop=0};
$('reset').onclick=()=>{query.value='';scope.value='';expanded.clear();expanded.add(0);select(0);tree.scrollTop=0};render();

function restoreField(){
 const path=new URLSearchParams(location.hash.slice(1)).get('field');
 const idx=fields.findIndex(f=>f.path===path);
 if(idx>=0)select(idx,true)
}
window.addEventListener('message',event=>{
 if(event.source!==parent||event.origin!==location.origin||event.data?.type!=='sedo-select-field'||event.data.revision!==data.revision||typeof event.data.path!=='string')return;
 const idx=fields.findIndex(f=>f.path===event.data.path);if(idx>=0)select(idx,true);
});
window.addEventListener('hashchange',()=>{restoreField();if(parent!==window)parent.postMessage({type:'sedo-field',revision:data.revision,path:fields[current].path},'*')});
restoreField();
</script></html>
