<script>
"use strict";
const occurrence=value=>/^\+?\d+$/.test(String(value).trim())?String(value).trim().replace(/^\+?0*(?=\d)/,''):String(value).trim();
const occurrenceGroups=value=>(value||'').replace(/\[\s*(\+?\d+)\s*\.\.\s*(\+?\d+|unbounded)\s*\]/g,(_,low,high)=>'['+occurrence(low)+'..'+occurrence(high)+']')
 .split(/\s+ИЛИ\s+/).map(branch=>branch.split(/\s*\/\s*/).filter(part=>! /^(?:sequence|all|choice|group) \[1\.\.1\]$/.test(part)).join(' / ')).join(' ИЛИ ');
const data=JSON.parse(document.querySelector('#catalog').textContent), fields=data.fields.map(field=>({...field,min:occurrence(field.min),max:occurrence(field.max),group:occurrenceGroups(field.group)}));
const $=id=>document.getElementById(id);
function el(tag,cls,txt){const x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x}
function button(cls,txt,fn){const b=el('button',cls,txt);b.type='button';b.onclick=fn;return b}
const normalize=s=>s.toLocaleLowerCase('ru').replaceAll('ё','е');
const typeChildren=field=>[...(field.alternatives||[]),...(field.listItem?[field.listItem]:[])];

 ...(type.facets||[]).flat(),...typeChildren(type).flatMap(typeSearchText)];
const index=fields.map(f=>normalize([f.name,f.path,f.doc,...f.values.flat(),...typeChildren(f).flatMap(typeSearchText)].join(' ')));
const branches=fields.map((f,i)=>i).filter(i=>i>0&&fields[i].children.length);

const reviewsByPath=new Map();
for(const source of data.review_sources||[])for(const finding of source.findings||[]){
 for(const path of new Set(finding.field_paths||[])){
  if(!reviewsByPath.has(path))reviewsByPath.set(path,[]);
  reviewsByPath.get(path).push({source,finding});
 }
}
const reviewCounts=fields.map(field=>(reviewsByPath.get(field.path)||[]).length);
const reviewTree=new Set(),reviewExpanded=new Set();
for(let i=0;i<fields.length;i++)if(reviewCounts[i]){
 for(let p=i;p>=0;p=fields[p].parent)reviewTree.add(p);
}
function reviewMark(i){
 const count=reviewCounts[i];if(!count)return null;
 const mark=el('span','review-mark','Замечания · '+count);
 mark.setAttribute('aria-label','Замечаний '+count);return mark;
}
const expanded=new Set([0]);let current=0;
const scope=$('scope'),query=$('query'),tree=$('tree'),detail=$('detail'),onlyReviews=$('review-only');
scope.add(new Option('Все разделы',''));
branches.forEach(i=>{const f=fields[i],description=f.doc||f.children.map(j=>fields[j].doc).filter(Boolean).slice(0,3).join(' / '),label=f.path.split('/').slice(1).join(' › ')+(description?' · '+description.replace(/\s+/g,' ').slice(0,90):'');scope.add(new Option(label,f.path))});
scope.disabled=!branches.length;
$('version').textContent=data.version+'  ·  '+(data.date||data.archive);
$('meta').textContent=data.archive+'  ·  '+data.files+' XSD  ·  '+fields.length+' позиций в дереве';
function inScope(i){return !scope.value||fields[i].path===scope.value||fields[i].path.startsWith(scope.value+'/')}
function select(i,show=false,writeHash=true){current=i;if(writeHash)location.hash=new URLSearchParams({field:fields[i].path}).toString();if(show){if(!inScope(i))scope.value='';query.value='';if(onlyReviews.checked&&!reviewTree.has(i))onlyReviews.checked=false;for(let p=fields[i].parent;p>=0;p=fields[p].parent){expanded.add(p);reviewExpanded.add(p)}}render();if(show)tree.querySelector('.active')?.scrollIntoView({block:'nearest'})}
function renderTree(){
 tree.replaceChildren();const terms=normalize(query.value.trim()).split(/\s+/).filter(Boolean);
 if(terms.length){

const facets={abstract:'Абстрактный элемент',typeAbstract:'Абстрактный тип (требуется конкретный xsi:type)',pattern:'Регулярное выражение XSD',minLength:'Минимальная длина',maxLength:'Максимальная длина',length:'Точная длина',minInclusive:'Минимум включительно',maxInclusive:'Максимум включительно',minExclusive:'Больше',maxExclusive:'Меньше',fractionDigits:'Знаков после запятой, до',totalDigits:'Всего цифр, до',whiteSpace:'Обработка пробелов',fixed:'Фиксированное значение',default:'По умолчанию',nillable:'Допускает xsi:nil',processContents:'Проверка содержимого',namespace:'Пространства имён'};

function valueRules(field){
 const rules=(field.facets||[]).filter(([key])=>key!=='pattern'||!field.patternGroups);
 if(field.patternGroups)rules.push(['Шаблоны XSD',field.patternGroups.map(group=>'('+group.map(pattern=>'«'+pattern+'»').join(' ИЛИ ')+')').join(' И ')]);
 return [...rules,...Object.entries(field.flags||{})];
}

function renderFieldReviews(field){

 for(const [label,group] of [['Замечания к полю',direct],['Замечания к дочерним полям',children]]){
  if(!group.length)continue;
  const section=el('section','field-reviews');section.setAttribute('aria-label',label);
  section.append(el('h3','',label+' · '+group.length));
  for(const {source,finding} of group){
   const item=el('article','field-review');item.append(el('h4','',finding.kind));
   const origin=el('p','quiet'),caption=source.name+(source.version?' · версия '+source.version:'')+(source.date?' · '+source.date:'');

}
function typeLabel(field,fallback){return field.type||field.base||(field.listItem?'Список значений':fallback)}

function renderTypeOptions(field,container){

 }
 const wildcard=f.kind==='any'||f.kind==='anyAttribute';

 const d=el('details','');d.append(el('summary','','Источник в XSD'),el('p','quiet','Объявление: '+f.file+(f.typeFile?' · Тип: '+f.typeFile:'')),el('p','quiet',description),el('p','quiet','Архив: '+data.archive),el('p','quiet','SHA-256: '+data.sha256));detail.append(d);
 if(query.value)detail.append(button('btn','Показать в дереве',()=>select(current,true)));

function render(){renderTree();renderDetail()}
onlyReviews.onchange=()=>{
 if(onlyReviews.checked){
  reviewExpanded.clear();

}
