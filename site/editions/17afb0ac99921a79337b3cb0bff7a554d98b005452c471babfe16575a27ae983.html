on.xsd","flags":{}},{"name":"@required","path":"confirmationRequest/benefit1Approve/calculationData/experience/@required","parent":123,"group":"","doc":"Атрибут указывающий, что наличие значения обязательно (not null) в ответе","kind":"attribute","min":"0","max":"1","type":"xs:boolean","base":"xs:boolean","facets":[],"values":[],"children":[],"ns":"","file":"Confirmation.xsd","flags":{}},{"name":"calcConditionList","path":"confirmationRequest/benefit1Approve/calculationData/calcConditionList","parent":104,"group":"","doc":"","kind":"element","min":"1","max":"1","type":"","base":"","facets":[],"values":[],"children":[139],"ns":"urn:ru:fss:integration:types:proactive:benefit1:v01","file":"Benefit1.xsd","flags":{"nillable":"true"}},{"name":"calcCondition","path":"confirmationRequest/benefit1Approve/calculationData/calcConditionList/calcCondition","parent":138,"group":"","doc":"Условия исчисления. При указании кода 43 необходимо заполнить причину радиационного воздействия","kind":"element","min":"1","max":"3","type":"","base":"xs:string","facets":[],"values":[["43","\"В соответствии с Федеральными законами от 26 ноября 1998г. № 175-ФЗ \"\"О социальной защите граждан Российской Федерации, подвергшихся воздействию радиации вследствие аварии в 1957 году на производственном объединении \"\"Маяк\"\" и сбросов радиоактивных отходов в реку Теча\"\" и от 10 января 2002г. № 2-ФЗ \"\"О социальных гарантиях гражданам, подвергшимся радиационному воздействию вследствие ядерных испытаний на Семипалатинском полигоне\"\", Законом Российской Федерации от 15 мая 1991г. № 1244-1 \"\"О социальной защите граждан, подвергшихся воздействию радиации вследствие катастрофы на Чернобыльской АЭС\"\", постановлением Правительства Российской Федерации от 30 марта 1993г. № 253 \"\"О порядке предоставления компенсаций и льгот лицам, пострадавшим от радиационных воздействий\"\", постановлением Верховного Совета Российской Федерации от 27 декабря 1991г. № 2123-1 \"\"О распространении действия Закона РСФСР \"\"О социальной защите граждан, подвергшихся воздействию радиации вследствие катастрофы на Чернобыльской АЭС на граждан из подразделений особого риска\"\" получатель пособия по временной нетрудоспособности или по беременности и родам имеет право на льготы при назначении и исчислении соответствующего вида пособия\""],["44","Получатель пособия по временной нетрудоспособности приступил к работе в районах Крайнего Севера и приравненных к ним местностях до 2007г. и продолжает работать в данных местностях."],["45","На момент наступления временной нетрудоспособности получатель пособия по временной нетрудоспособности имеет группу инвалидности"],["46","На момент наступления временной нетрудоспособности с получателем заключен трудовой договор (служебный контракт) или договор гражданско-правового характера на срок менее 6 месяцев. Данный код не проставляется в случае указания кода \"11\" в строке \"Причина нетрудоспособности\""],["47","\"Заболевание или травма у получателя пособия по временной нетрудоспособности наступили в течение 30 календарных дней после прекращения работы по трудовому договору, служебной или иной деятельности, в течение которой он подлежит обязательному социальному страхованию.\""],["48","При уважительной причине нарушения режима (в случае если в строке \"Отметки о нарушении режима\" проставлен соответствующий код)"],["49","\"В случае если продолжительность заболевания превышает 4 месяца подряд, - для застрахованных лиц, имеющих инвалидность на день наступления страхового случая. Данный код не проставляется в случае указания кода \"\"11\"\" в строке \"\"Причина нетрудоспособности\"\";\""],["50","В случае если продолжительность заболевания превышает 5 месяцев в календарном году, - для застрахованных лиц, имеющих инвалидность на день наступления страхового случая. Данный код не проставляется в случае указания кода \"11\" в строке \"Причина нетрудоспособности\""],["51","В случае, указанном в части 1.1. статьи 14 Федерального закона от 29 декабря 2006 г. № еча\"\" и от 10 января 2002г. № 2-ФЗ \"\"О социальных гарантиях гражданам, подвергшимся радиационному воздействию вследствие ядерных испытаний на Семипалатинском полигоне\"\", Законом Российской Федерации от 15 мая 1991г. № 1244-1 \"\"О социальной защите граждан, подвергшихся воздействию радиации вследствие катастрофы на Чернобыльской АЭС\"\", постановлением Правительства Российской Федерации от 30 марта 1993г. № 253 \"\"О порядке предоставления компенсаций и льгот лицам, пострадавшим от радиационных воздействий\"\", постановлением Верховного Совета Российской Федерации от 27 декабря 1991г. № 2123-1 \"\"О распространении действия Закона РСФСР \"\"О социальной защите граждан, подвергшихся воздействию радиации вследствие катастрофы на Чернобыльской АЭС на граждан из подразделений особого риска\"\" получатель пособия по временной нетрудоспособности или по беременности и родам имеет право на льготы при назначении и исчислении соответствующего вида пособия\""],["44","Получатель пособия по временной нетрудоспособности приступил к работе в районах Крайнего Севера и приравненных к ним местностях до 2007г. и продолжает работать в данных местностях."],["45","На момент наступления временной нетрудоспособности получатель пособия по временной нетрудоспособности имеет группу инвалидности"],["46","На момент наступления временной нетрудоспособности с получателем заключен трудовой договор (служебный контракт) или договор гражданско-правового характера на срок менее 6 месяцев. Данный код не проставляется в случае указания кода \"11\" в строке \"Причина нетрудоспособности\""],["47","\"Заболевание или травма у получателя пособия по временной нетрудоспособности наступили в течение 30 календарных дней после прекращения работы по трудовому договору, служебной или иной деятельности, в течение которой он подлежит обязательному социальному страхованию.\""],["48","При уважительной причине нарушения режима (в случае если в строке \"Отметки о нарушении режима\" проставлен соответствующий код)"],["49","\"В случае если продолжительность заболевания превышает 4 месяца подряд, - для застрахованных лиц, имеющих инвалидность на день наступления страхового случая. Данный код не проставляется в случае указания кода \"\"11\"\" в строке \"\"Причина нетрудоспособности\"\";\""],["50","В случае если продолжительность заболевания превышает 5 месяцев в календарном году, - для застрахованных лиц, имеющих инвалидность на день наступления страхового случая. Данный код не проставляется в случае указания кода \"11\" в строке \"Причина нетрудоспособности\""],["51","В случае, указанном в части 1.1. статьи 14 Федерального закона от 29 декабря 2006 г. № 255-ФЗ \"Об обязательном социальном страховании на случай временной нетрудоспособности и в связи с материнством\", когда застрахованное лицо на момент наступления страхового случая работает на условиях неполного рабочего времени (неполной рабочей недели, неполного рабочего дня)"],["52","Аннулирование трудового договора."]],"children":[342,343],"ns":"urn:ru:fss:integration:types:proactive:benefit2:v01","file":"Benefit2.xsd","flags":{},"typeFile":"ConditionsCalc.xsd"},{"name":"@editable","path":"confirmationRequest/benefit2Approve/calculationData/calcConditionList/calcCondition/@editable","parent":341,"group":"","doc":"Атрибут указывающий, что значение элемента может быть изменено в ответе","kind":"attribute","min":"0","max":"1","type":"xs:boolean","base":"xs:boolean","facets":[],"values":[],"children":[],"ns":"","file":"Confirmation.xsd","flags":{}},{"name":"@required","path":"confirmationRequest/benefit2Approve/calculationData/calcConditionList/calcCondition/@required","parent":341,"group":"","doc":"Атрибут указывающий, что наличие значения обязательно (not null) в ответе","kind":"attribute","min":"0","max":"1","type":"xs:boolean","base":"xs:boolean","facets":[],"values":[],"children":[],"ns":"","file":"Confirmation.xsd","flags":{}},{"name":"causeRadiation","path":"confirmationRequest/benefit2Approve/calculationData/causeRadiatio ","base":"xs:string","facets":[],"values":[["43","\"В соответствии с Федеральными законами от 26 ноября 1998г. № 175-ФЗ \"\"О социальной защите граждан Российской Федерации, подвергшихся воздействию радиации вследствие аварии в 1957 году на производственном объединении \"\"Маяк\"\" и сбросов радиоактивных отходов в реку Теча\"\" и от 10 января 2002г. № 2-ФЗ \"\"О социальных гарантиях гражданам, подвергшимся радиационному воздействию вследствие ядерных испытаний на Семипалатинском полигоне\"\", Законом Российской Федерации от 15 мая 1991г. № 1244-1 \"\"О социальной защите граждан, подвергшихся воздействию радиации вследствие катастрофы на Чернобыльской АЭС\"\", постановлением Правительства Российской Федерации от 30 марта 1993г. № 253 \"\"О порядке предоставления компенсаций и льгот лицам, пострадавшим от радиационных воздействий\"\", постановлением Верховного Совета Российской Федерации от 27 декабря 1991г. № 2123-1 \"\"О распространении действия Закона РСФСР \"\"О социальной защите граждан, подвергшихся воздействию радиации вследствие катастрофы на Чернобыльской АЭС на граждан из подразделений особого риска\"\" получатель пособия по временной нетрудоспособности или по беременности и родам имеет право на льготы при назначении и исчислении соответствующего вида пособия\""],["44","Получатель пособия по временной нетрудоспособности приступил к работе в районах Крайнего Севера и приравненных к ним местностях до 2007г. и продолжает работать в данных местностях."],["45","На момент наступления временной нетрудоспособности получатель пособия по временной нетрудоспособности имеет группу инвалидности"],["46","На момент наступления временной нетрудоспособности с получателем заключен трудовой договор (служебный контракт) или договор гражданско-правового характера на срок менее 6 месяцев. Данный код не проставляется в случае указания кода \"11\" в строке \"Причина нетрудоспособности\""],["47","\"Заболевание или травма у получателя пособия по временной нетрудоспособности наступили в течение 30 календарных дней после прекращения работы по трудовому договору, служебной или иной деятельности, в течение которой он подлежит обязательному социальному страхованию.\""],["48","При уважительной причине нарушения режима (в случае если в строке \"Отметки о нарушении режима\" проставлен соответствующий код)"],["49","\"В случае если продолжительность заболевания превышает 4 месяца подряд, - для застрахованных лиц, имеющих инвалидность на день наступления страхового случая. Данный код не проставляется в случае указания кода \"\"11\"\" в строке \"\"Причина нетрудоспособности\"\";\""],["50","В случае если продолжительность заболевания превышает 5 месяцев в календарном году, - для застрахованных лиц, имеющих инвалидность на день наступления страхового случая. Данный код не проставляется в случае указания кода \"11\" в строке \"Причина нетрудоспособности\""],["51","В случае, указанном в части 1.1. статьи 14 Федерального закона от 29 декабря 2006 г. № 255-ФЗ \"Об обязательном социальном страховании на случай временной нетрудоспособности и в связи с материнством\", когда застрахованное лицо на момент наступления страхового случая работает на условиях неполного рабочего времени (неполной рабочей недели, неполного рабочего дня)"],["52","Аннулирование трудового договора."]],"children":[942,943],"ns":"urn:ru:fss:integration:types:proactive:benefit6:v01","file":"Benefit6.xsd","flags":{},"typeFile":"ConditionsCalc.xsd"},{"name":"@editable","path":"confirmationRequest/benefit6Approve/calculationData/calcConditionList/calcCondition/@editable","parent":941,"group":"","doc":"Атрибут указывающий, что значение элемента может быть изменено в ответе","kind":"attribute","min":"0","max":"1","type":"xs:boolean","base":"xs:boolean","facets":[],"values":[],"children":[],"ns":"","file":"Confirmation.xsd","flags":{}},{"name":"@required","path":"confirmationRequest/benefit6Approve/calculationData/calcConditionList/calcCondition/@required","parent":941,"group":"","doc":"Атрибут указы :"Дата извещения","kind":"element","min":"1","max":"1","type":"xs:date","base":"xs:date","facets":[],"values":[],"children":[],"ns":"urn:ru:fss:integration:types:proactive:benefit6:v01","file":"Benefit6.xsd","flags":{}},{"name":"recalculation","path":"confirmationRequest/recalculation","parent":0,"group":"","doc":"Заполняется в случае, если был инициирован перерасчёт","kind":"element","min":"0","max":"1","type":"RecalculationType","base":"","facets":[],"values":[],"children":[998],"ns":"urn:ru:fss:integration:types:proactive:v01","file":"Confirmation.xsd","flags":{},"typeFile":"Confirmation.xsd"},{"name":"batchNum","path":"confirmationRequest/recalculation/batchNum","parent":997,"group":"","doc":"Идентификатор (BATCH_NO) записи реестра выплаты","kind":"element","min":"1","max":"1","type":"batch_no","base":"xs:string","facets":[["pattern","[C|E|P]_\\d{10}_(19|20)[0-9]{2}_[0|1][0-9]_[0-3][0-9]_\\d{1,9}[\\S]{0,5}:\\d{1,3}|\\S{18}"]],"values":[],"children":[],"ns":"urn:ru:fss:integration:types:proactive:v01","file":"Confirmation.xsd","flags":{},"typeFile":"Confirmation.xsd"}],"revision":"17afb0ac99921a79337b3cb0bff7a554d98b005452c471babfe16575a27ae983","version":"2.49","date":"18.12.2025","archive":"proactive-xsd-1.51.0-SNAPSHOT-test.zip","files":20,"sha256":"100a224028b26509e5ec7c8846a0426e52be25c5abf0b0eee0a62606ff8d9b87"}</script>
<script>
"use strict";
const data=JSON.parse(document.querySelector('#catalog').textContent), fields=data.fields;
const $=id=>document.getElementById(id);
function el(tag,cls,txt){const x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x}
function button(cls,txt,fn){const b=el('button',cls,txt);b.type='button';b.onclick=fn;return b}
const normalize=s=>s.toLocaleLowerCase('ru').replaceAll('ё','е');
const alternativeText=rows=>(rows||[]).flatMap(r=>[r.type||'',r.base||'',...(r.values||[]).flat(),...alternativeText(r.alternatives)]);
const index=fields.map(f=>normalize([f.name,f.path,f.doc,...f.values.flat(),...alternativeText(f.alternatives)].join(' ')));
const branches=fields.map((f,i)=>i).filter(i=>i>0&&fields[i].children.length);
const expanded=new Set([0]);let current=0;
const scope=$('scope'),query=$('query'),tree=$('tree'),detail=$('detail');
scope.add(new Option('Все разделы',''));
branches.forEach(i=>{const f=fields[i],description=f.doc||f.children.map(j=>fields[j].doc).filter(Boolean).slice(0,3).join(' / '),label=f.path.split('/').slice(1).join(' › ')+(description?' · '+description.replace(/\s+/g,' ').slice(0,90):'');scope.add(new Option(label,f.path))});
scope.disabled=!branches.length;
$('version').textContent=data.version+'  ·  '+(data.date||data.archive);
$('meta').textContent=data.archive+'  ·  '+data.files+' XSD  ·  '+fields.length+' позиций в дереве';
function inScope(i){return !scope.value||fields[i].path===scope.value||fields[i].path.startsWith(scope.value+'/')}
function select(i,show=false){current=i;location.hash=new URLSearchParams({field:fields[i].path}).toString();if(show){if(!inScope(i))scope.value='';query.value='';for(let p=fields[i].parent;p>=0;p=fields[p].parent)expanded.add(p)}render();if(show)tree.querySelector('.active')?.scrollIntoView({block:'nearest'})}
function renderTree(){
 tree.replaceChildren();const terms=normalize(query.value.trim()).split(/\s+/).filter(Boolean);
 if(terms.length){
 const hits=fields.map((f,i)=>i).filter(i=>inScope(i)&&terms.every(t=>index[i].includes(t)));
 const score=i=>terms.reduce((s,t)=>s+(normalize(fields[i].name)===t?6:normalize(fields[i].name).includes(t)?3:normalize(fields[i].doc).includes(t)?1:0),0);
 hits.sort((a,b)=>score(b)-score(a));$('status').textContent='Найдено: '+hits.length;
 for(const i of hits){const f=fields[i],b=button('result'+(i===current?' active':''),'',()=>select(i));b.append(el('b','',f.name),el('small','',f.path),el('small','',f.doc.slice(0,140)));tree.append(b)}
 if(!hits.length)tree.append(el('p','empty','Совпадений нет. Попробуйте часть названия или описания.'));return}
 $('status').textContent='Структура сообщения';
 function row(i,depth){const f=fields[i],r=el('div','item'+(current===i?' active':''));r.style.setProperty('--depth',depth);
 if(f.children.length){const c=button('caret',expanded.has(i)?'▾':'▸',()=>{expanded.has(i)?expanded.delete(i):expanded.add(i);renderTree()});c.setAttribute('aria-label',(expanded.has(i)?'Свернуть ':'Раскрыть ')+f.name);c.setAttribute('aria-expanded',expanded.has(i));r.append(c)}else r.append(el('span','leaf','·'));
 const b=button('name',f.name,()=>select(i));b.title=f.doc||f.path;r.append(b);tree.append(r);if(expanded.has(i))f.children.forEach(n=>row(n,depth+1))}
 if(scope.value)row(branches.find(i=>fields[i].path===scope.value),0);else row(0,0);
}
const facets={pattern:'Регулярное выражение XSD',minLength:'Минимальная длина',maxLength:'Максимальная длина',length:'Точная длина',minInclusive:'Минимум включительно',maxInclusive:'Максимум включительно',minExclusive:'Больше',maxExclusive:'Меньше',fractionDigits:'Знаков после запятой, до',totalDigits:'Всего цифр, до',whiteSpace:'Обработка пробелов',fixed:'Фиксированное значение',default:'По умолчанию',nillable:'Допускает xsi:nil',processContents:'Проверка содержимого',namespace:'Пространства имён'};
const builtins={boolean:'Логическое значение: true, false, 1 или 0.',date:'Дата XML Schema, например 2026-09-19.',long:'Целое число от −9223372036854775808 до 9223372036854775807.',integer:'Целое число.',decimal:'Десятичное число. Разделитель дробной части — точка.',int:'Целое число от −2147483648 до 2147483647.'};
function renderDetail(){const f=fields[current];detail.replaceChildren();const ancestors=[];for(let p=f.parent;p>=0;p=fields[p].parent)ancestors.unshift(p);
 const nav=el('div','breadcrumbs');ancestors.forEach(i=>nav.append(button('crumb',fields[i].name,()=>select(i,true)),document.createTextNode(' / ')));detail.append(nav);
 const title=el('div','title');title.append(el('h2','',f.name),el('span','pill',f.kind==='attribute'?'Атрибут':f.kind==='any'?'Расширение':f.children.length?'Блок':'Поле'));detail.append(title);
 if(f.doc)detail.append(el('p','doc',f.doc));const path=el('div','pathbox'),copy=button('btn','Копировать путь',async()=>{try{await navigator.clipboard.writeText(f.path);copy.textContent='Скопировано'}catch{const range=document.createRange();range.selectNodeContents(path.firstChild);const sel=getSelection();sel.removeAllRanges();sel.addRange(range);copy.textContent='Нажмите Ctrl+C'}});path.append(el('code','',f.path),copy);detail.append(path);
 const facts=el('div','facts');for(const [label,val] of [['Тип',f.type||f.base||(f.children.length?'Составной':'По схеме')],['Кратность',f.min+' … '+(f.max==='unbounded'?'∞':f.max)],['В родительском блоке',f.group?'Вариант выбора':f.min==='0'?'Необязательно':f.parent<0?'Корень':'Обязательно']]){const a=el('div','fact');a.append(el('span','label',label),el('b','',val));facts.append(a)}detail.append(facts);
 const req=[...f.facets,...Object.entries(f.flags)],base=builtins[f.base.split(':').pop()];
 if(req.length||base||f.group){detail.append(el('h3','','Ограничения ввода'));const ul=el('ul','rules');if(base)ul.append(el('li','',base));if(f.group)ul.append(el('li','',''+f.group+'. Поля с одинаковым номером варианта входят в него вместе. Кратность указана внутри варианта.'));for(const [k,v] of req){const li=el('li','',(facets[k]||k)+': ');li.append(el('code','',v));ul.append(li)}detail.append(ul)}
 const conditions=ancestors.filter(i=>/обязател|необходимо|при указании|при условии/i.test(fields[i].doc));if(conditions.length){detail.append(el('h3','','Условия родительских блоков'));conditions.forEach(i=>detail.append(el('p','quiet',fields[i].name+' · '+fields[i].doc)))}
 if(f.alternatives?.length){
  detail.append(el('h3','','Допустимые варианты типа (union)'),el('p','quiet','Значение должно соответствовать хотя бы одному варианту. Ограничения разных вариантов не объединяются.'));
  function showAlternatives(rows,container){for(const [i,option] of rows.entries()){const box=el('div','value');box.append(el('b','','Вариант '+(i+1)+' · '+(option.type||option.base||'Составной тип')));const rules=el('ul','rules');for(const [k,v] of [...(option.facets||[]),...Object.entries(option.flags||{})])rules.append(el('li','',(facets[k]||k)+': '+v));for(const [value,doc] of option.values||[])rules.append(el('li','',(value===''?'«пустая строка»':value)+(doc?' · '+doc:'')));box.append(rules);if(option.alternatives)showAlternatives(option.alternatives,box);container.append(box)}}
  showAlternatives(f.alternatives,detail);
 }
 if(f.values.length){detail.append(el('h3','','Допустимые значения · '+f.values.length));for(const [v,n] of f.values){const r=el('div','value');r.append(el('code','',v||'«»'),el('span','',n));detail.append(r)}}
 if(f.children.length){detail.append(el('h3','','Состав блока'));const list=el('div','children');for(const i of f.children){const n=fields[i],b=button('child','',()=>select(i,true));b.append(el('b','',n.name),el('small','',(n.group?n.group+' · ':'')+(n.doc||n.type||'Элемент схемы')));list.append(b)}detail.append(list)}
 const d=el('details','');d.append(el('summary','','Источник в XSD'),el('p','quiet','Объявление: '+f.file+(f.typeFile?' · Тип: '+f.typeFile:'')),el('p','quiet','Пространство имён: '+(f.ns||'без пространства имён')),el('p','quiet','Архив: '+data.archive),el('p','quiet','SHA-256: '+data.sha256));detail.append(d);
 if(query.value)detail.append(button('btn','Показать в дереве',()=>select(current,true)));
}
function render(){renderTree();renderDetail()}
query.oninput=()=>{render();tree.scrollTop=0};scope.onchange=()=>{if(scope.value){const next=branches.find(i=>fields[i].path===scope.value);expanded.add(next);select(next)}else render();tree.scrollTop=0};
$('reset').onclick=()=>{query.value='';scope.value='';expanded.clear();expanded.add(0);select(0);tree.scrollTop=0};render();

function restoreField(){
 const path=new URLSearchParams(location.hash.slice(1)).get('field');
 const idx=fields.findIndex(f=>f.path===path);
 if(idx>=0 && idx!==current){current=idx;for(let p=fields[idx].parent;p>=0;p=fields[p].parent)expanded.add(p);render()}
}
window.addEventListener('hashchange',()=>{restoreField();if(parent!==window)parent.postMessage({type:'sedo-field',revision:data.revision,path:fields[current].path},'*')});
restoreField();
</script></html>
