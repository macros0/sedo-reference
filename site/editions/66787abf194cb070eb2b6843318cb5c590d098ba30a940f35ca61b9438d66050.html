<style>

<script>
"use strict";
const data=JSON.parse(document.querySelector('#catalog').textContent), fields=data.fields;
const $=id=>document.getElementById(id);
function el(tag,cls,txt){const x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x}
function button(cls,txt,fn){const b=el('button',cls,txt);b.type='button';b.onclick=fn;return b}
const normalize=s=>s.toLocaleLowerCase('ru').replaceAll('ё','е');
const index=fields.map(f=>normalize([f.name,f.path,f.doc,...f.values.flat()].join(' ')));
const branches=fields[0].children.filter(i=>/^benefit\d+$/.test(fields[i].name)||fields[i].name==='refusal');
const branchOf=fields.map(f=>f.path.split('/')[1]||'');
const expanded=new Set([0,branches[0]]);let current=branches[0]??0;
const scope=$('scope'),query=$('query'),tree=$('tree'),detail=$('detail');
scope.add(new Option('Все разделы',''));
branches.forEach(i=>scope.add(new Option(fields[i].name+' · '+fields[i].doc,fields[i].name)));
$('version').textContent=data.version+'  ·  '+(data.date||data.archive);
$('meta').textContent=data.archive+'  ·  '+data.files+' XSD  ·  '+fields.length+' позиций в дереве';
function inScope(i){return !scope.value||branchOf[i]===scope.value}
function select(i,show=false){current=i;location.hash=new URLSearchParams({field:fields[i].path}).toString();if(show){scope.value='';query.value='';for(let p=fields[i].parent;p>=0;p=fields[p].parent)expanded.add(p)}render();if(show)tree.querySelector('.active')?.scrollIntoView({block:'nearest'})}
function renderTree(){
 tree.replaceChildren();const terms=normalize(query.value.trim()).split(/\s+/).filter(Boolean);
 if(terms.length){
 const hits=fields.map((f,i)=>i).filter(i=>inScope(i)&&terms.every(t=>index[i].includes(t)));
 const score=i=>terms.reduce((s,t)=>s+(normalize(fields[i].name)===t?6:normalize(fields[i].name).includes(t)?3:normalize(fields[i].doc).includes(t)?1:0),0);
 hits.sort((a,b)=>score(b)-score(a));$('status').textContent='Найдено: '+hits.length;
 for(const i of hits){const f=fields[i],b=button('result'+(i===current?' active':''),'',()=>select(i));b.append(el('b','',f.name),el('small','',f.path),el('small','',f.doc.slice(0,140)));tree.append(b)}
 if(!hits.length)tree.append(el('p','empty','Совпадений нет. Попробуйте часть названия или описания.'));return}
 $('status').textContent='Структура сообщения';
 function row(i,depth){const f=fields[i],r=el('div','item'+(current===i?' active':''));r.style.setProperty('--depth',depth);
 if(f.children.length){const c=button('caret',expanded.has(i)?'▾':'▸',()=>{expanded.has(i)?expanded.delete(i):expanded.add(i);renderTree()});c.setAttribute('aria-label',(expanded.has(i)?'Свернуть ':'Раскрыть ')+f.name);c.setAttribute('aria-expanded',expanded.has(i));r.append(c)}else r.append(el('span','leaf','·'));
 const b=button('name',f.name,()=>select(i));b.title=f.doc||f.path;r.append(b);tree.append(r);if(expanded.has(i))f.children.forEach(n=>row(n,depth+1))}
 if(scope.value)row(branches.find(i=>fields[i].name===scope.value),0);else row(0,0);
}
const facets={pattern:'Регулярное выражение XSD',minLength:'Минимальная длина',maxLength:'Максимальная длина',length:'Точная длина',minInclusive:'Минимум включительно',maxInclusive:'Максимум включительно',minExclusive:'Больше',maxExclusive:'Меньше',fractionDigits:'Знаков после запятой, до',totalDigits:'Всего цифр, до',whiteSpace:'Обработка пробелов',fixed:'Фиксированное значение',default:'По умолчанию',nillable:'Допускает xsi:nil',processContents:'Проверка содержимого',namespace:'Пространства имён'};
const builtins={boolean:'Логическое значение: true, false, 1 или 0.',date:'Дата XML Schema, например 2026-09-19.',long:'Целое число от −9223372036854775808 до 9223372036854775807.',integer:'Целое число.',decimal:'Десятичное число. Разделитель дробной части — точка.',int:'Целое число от −2147483648 до 2147483647.'};
function renderDetail(){const f=fields[current];detail.replaceChildren();const ancestors=[];for(let p=f.parent;p>=0;p=fields[p].parent)ancestors.unshift(p);
 const nav=el('div','breadcrumbs');ancestors.forEach(i=>nav.append(button('crumb',fields[i].name,()=>select(i,true)),document.createTextNode(' / ')));detail.append(nav);
 const title=el('div','title');title.append(el('h2','',f.name),el('span','pill',f.kind==='attribute'?'Атрибут':f.kind==='any'?'Расширение':f.children.length?'Блок':'Поле'));detail.append(title);
 if(f.doc)detail.append(el('p','doc',f.doc));const path=el('div','pathbox'),copy=button('btn','Копировать путь',async()=>{try{await navigator.clipboard.writeText(f.path);copy.textContent='Скопировано'}catch{const range=document.createRange();range.selectNodeContents(path.firstChild);const sel=getSelection();sel.removeAllRanges();sel.addRange(range);copy.textContent='Нажмите Ctrl+C'}});path.append(el('code','',f.path),copy);detail.append(path);
 const facts=el('div','facts');for(const [label,val] of [['Тип',f.type||f.base||(f.children.length?'Составной':'По схеме')],['Кратность',f.min+' … '+(f.max==='unbounded'?'∞':f.max)],['В родительском блоке',f.group?'Вариант выбора':f.min==='0'?'Необязательно':f.parent<0?'Корень':'Обязательно']]){const a=el('div','fact');a.append(el('span','label',label),el('b','',val));facts.append(a)}detail.append(facts);
 const req=[...f.facets,...Object.entries(f.flags)],base=builtins[f.base.split(':').pop()];
 if(req.length||base||f.group){detail.append(el('h3','','Ограничения ввода'));const ul=el('ul','rules');if(base)ul.append(el('li','',base));if(f.group)ul.append(el('li','',''+f.group+'. Поля с одинаковым номером варианта входят в него вместе. Кратность указана внутри варианта.'));for(const [k,v] of req){const li=el('li','',(facets[k]||k)+': ');li.append(el('code','',v));ul.append(li)}detail.append(ul)}
 const conditions=ancestors.filter(i=>/обязател|необходимо|при указании|при условии/i.test(fields[i].doc));if(conditions.length){detail.append(el('h3','','Условия родительских блоков'));conditions.forEach(i=>detail.append(el('p','quiet',fields[i].name+' · '+fields[i].doc)))}
 if(f.values.length){detail.append(el('h3','','Допустимые значения · '+f.values.length));for(const [v,n] of f.values){const r=el('div','value');r.append(el('code','',v||'«»'),el('span','',n));detail.append(r)}}
 if(f.children.length){detail.append(el('h3','','Состав блока'));const list=el('div','children');for(const i of f.children){const n=fields[i],b=button('child','',()=>select(i,true));b.append(el('b','',n.name),el('small','',(n.group?n.group+' · ':'')+(n.doc||n.type||'Элемент схемы')));list.append(b)}detail.append(list)}
 const d=el('details','');d.append(el('summary','','Источник в XSD'),el('p','quiet','Объявление: '+f.file+(f.typeFile?' · Тип: '+f.typeFile:'')),el('p','quiet','Пространство имён: '+(f.ns||'без пространства имён')),el('p','quiet','Архив: '+data.archive),el('p','quiet','SHA-256: '+data.sha256));detail.append(d);
 if(query.value)detail.append(button('btn','Показать в дереве',()=>select(current,true)));
}
function render(){renderTree();renderDetail()}
query.oninput=()=>{render();tree.scrollTop=0};scope.onchange=()=>{if(scope.value){current=branches.find(i=>fields[i].name===scope.value);expanded.add(current)}render();tree.scrollTop=0};
$('reset').onclick=()=>{query.value='';scope.value='';expanded.clear();expanded.add(0);current=branches[0]??0;expanded.add(current);render();tree.scrollTop=0};render();

function restoreField(){
 const path=new URLSearchParams(location.hash.slice(1)).get('field');
 const idx=fields.findIndex(f=>f.path===path);
 if(idx>=0 && idx!==current){current=idx;for(let p=fields[idx].parent;p>=0;p=fields[p].parent)expanded.add(p);render()}
}
window.addEventListener('hashchange',()=>{restoreField();if(parent!==window)parent.postMessage({type:'sedo-field',revision:data.revision,path:fields[current].path},'*')});
restoreField();
</script></html>
