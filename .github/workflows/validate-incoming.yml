name: Validate incoming specifications
on:
  pull_request:
    paths:
      - 'incoming/**'
      - 'import_inbox.py'
      - 'manual_import.py'
      - 'catalog.py'
      - 'fields.py'
      - 'schema.py'
      - 'sync.py'
      - 'module_xsd.py'
      - 'wsdl_sources.py'
      - 'collector.py'
      - 'collector_snapshots.py'
      - 'collector_feed.py'
      - 'collector_transport.py'
      - 'sourcecraft_pull.py'
      - 'automation_status.py'
      - 'web/automation-status.js'
      - 'tests/test_automation_status.py'
      - 'tests/test_automation_status.cjs'
      - '.github/workflows/automation-status.yml'
      - 'tests/test_collector_feed.py'
      - 'tests/test_collector_transport.py'
      - 'state/collector/**'
      - 'tests/test_collector.py'
      - 'tests/test_wsdl_sources.py'
      - 'requirements.txt'
      - 'build_site.py'
      - 'schema_review.py'
      - 'source_provenance.py'
      - 'tests/test_source_provenance.py'
      - 'web/review-journal.js'
      - 'tests/test_review_journal.cjs'
      - 'audit_*.py'
      - 'tests/test_audit_*.py'
      - 'tests/test_schema_review.py'
      - 'tests/test_schema_origin.cjs'
      - 'xsd_bundle.py'
      - 'xsd_validate.py'
      - 'tests/test_xsd_bundle.py'
      - 'edition_groups.py'
      - 'tests/test_edition_groups.py'
      - 'tests/test_source_updates.py'
      - 'tests/test_edition_groups.cjs'
      - 'web/app.js'
      - 'web/validation*.js'
      - 'web/vendor/xmllint/**'
      - 'tests/test_browser_validation.cjs'
      - 'tests/test_validation_paths.cjs'
      - 'tests/test_validation_source.cjs'
      - 'tests/test_validation_messages.cjs'
      - 'tests/test_validation_navigation.cjs'
      - 'web/journal.js'
      - 'data/message-transitions.json'
      - 'web/message-transitions.js'
      - 'web/comparison-export.js'
      - 'web/comparison-mapping.js'
      - 'web/mapping-draft.js'
      - 'web/mapping-editor.js'
      - 'tests/test_mapping_draft.cjs'
      - 'tests/test_mapping_editor.cjs'
      - 'tests/test_mapping_apply.cjs'
      - 'web/compare-core.js'
      - 'tests/test_comparison_mapping.cjs'
      - 'tests/test_mapping_suggestions.cjs'
      - 'web/vendor/**'
      - 'tests/test_comparison_export.cjs'
      - 'tests/test_transitions.cjs'
      - '.github/workflows/validate-incoming.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema extraction dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Preview incoming without saving or publishing
        run: |
          node tests/test_transitions.cjs
          node tests/test_viewer_sections.cjs
          node tests/test_schema_origin.cjs
          node tests/test_review_journal.cjs
          node tests/test_cross_message_compare.cjs
          node tests/test_comparison_export.cjs
          node tests/test_comparison_mapping.cjs
          node tests/test_mapping_suggestions.cjs
          node tests/test_mapping_draft.cjs
          node tests/test_mapping_editor.cjs
          node tests/test_mapping_apply.cjs
          node tests/test_edition_groups.cjs
          node tests/test_browser_validation.cjs
          node tests/test_validation_paths.cjs
          node tests/test_validation_source.cjs
          node tests/test_validation_messages.cjs
          node tests/test_validation_navigation.cjs
          python -m unittest tests.test_xsd_bundle tests.test_automation_status -q
          node tests/test_automation_status.cjs
          python import_inbox.py --check
      - name: Write validation report
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          report = Path("inbox-report.json")
          if report.exists():
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf8") as f:
                  f.write("## Incoming validation\n\n~~~json\n" + report.read_text("utf8") + "\n~~~\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: incoming-validation-report
          path: inbox-report.json
          if-no-files-found: ignore
          retention-days: 30
