name: Check SFR catalogs
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reference-main
  queue: max
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The online capture and the full candidate test run have separate costs.
    timeout-minutes: 120
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema extraction dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test history preservation and update failures
        run: |
          python -m unittest tests.test_collector tests.test_collector_feed tests.test_collector_transport tests.test_source_transport tests.test_sync_queue tests.test_update_catalog_lock -v
          npm run test:node
      - name: Restore partial SourceCraft downloads
        if: vars.SEDO_COLLECTOR_SOURCE != 'home'
        uses: actions/cache/restore@v4
        with:
          path: .sourcecraft-import
          key: sourcecraft-inputs-v1-main-${{ hashFiles('state/collector/feed.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sourcecraft-inputs-v1-main-${{ hashFiles('state/collector/feed.json') }}-
      - name: Import verified SourceCraft WSDL snapshots
        id: sourcecraft
        if: vars.SEDO_COLLECTOR_SOURCE != 'home'
        run: python sourcecraft_pull.py
      - name: Check for resumable SourceCraft work
        id: resume
        if: failure() && steps.sourcecraft.outcome == 'failure'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = Path('sourcecraft-report.json')
          if report.is_file() and json.loads(report.read_bytes()).get('resumable'):
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  print('needed=true', file=output)
          PY
      - name: Save partial SourceCraft downloads
        if: failure() && steps.resume.outputs.needed == 'true'
        uses: actions/cache/save@v4
        with:
          path: .sourcecraft-import
          key: sourcecraft-inputs-v1-main-${{ hashFiles('state/collector/feed.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Collect both contours and validate candidate
        env:
          SEDO_SFR_POLITE: '1'
          SEDO_COLLECTOR_SOURCE: ${{ vars.SEDO_COLLECTOR_SOURCE || 'sourcecraft' }}
        run: |
          python auto_update.py
          python verify.py
          node tests/test_browser_validation.cjs --all-editions
          node tests/test_attribute_ref_constraints.cjs --all-editions
      - name: Test generated candidate invariants
        run: |
          python -m tests.run_python_tests --jobs 2
          npm run test:node
      - name: Check candidate in Chromium before saving
        run: npm run test:browser
      - name: Save browser test report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 30
      - name: Commit validated data and deploy
        run: |
          git add state data site
          if ! git diff --cached --quiet; then
            git commit -m "Update SFR specifications and check status"
            git push origin HEAD:main
          fi
          # GITHUB_TOKEN pushes do not trigger the Pages push workflow.
          # Explicit dispatch also retries deployment after a previous Pages failure.
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          head = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          catalog = hashlib.sha256(Path('site/catalog-data.js').read_bytes()).hexdigest()
          target = dict(update_run_id=os.environ['GITHUB_RUN_ID'], update_run_attempt=os.environ['GITHUB_RUN_ATTEMPT'],
                        head_sha=head, catalog_sha256=catalog)
          Path('publication-target.json').write_text(json.dumps(target), encoding='utf-8')
          PY
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main --json < publication-target.json
      - name: Write update summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = Path("update-report.json")
          if report.exists():
              r = json.loads(report.read_bytes())
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf8") as f:
                  f.write("## SFR update\n\n")
                  f.write("~~~json\n" + json.dumps(r, ensure_ascii=False, indent=2) + "\n~~~\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sfr-update-report-${{ github.run_attempt }}
          path: |
            update-report.json
            sourcecraft-report.json
            publication-target.json
          if-no-files-found: ignore
          retention-days: 30
