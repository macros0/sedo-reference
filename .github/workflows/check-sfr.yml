name: Check SFR catalogs
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reference-main
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema extraction dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test history preservation and update failures
        run: |
          python -m unittest discover -s tests -v
          node tests/test_automation_status.cjs
          node tests/test_compare.cjs
          node tests/test_update_summaries.cjs
          node tests/test_journal_dates.cjs
          node tests/test_transitions.cjs
          node tests/test_viewer_sections.cjs
          node tests/test_schema_origin.cjs
          node tests/test_cross_message_compare.cjs
          node tests/test_comparison_export.cjs
          node tests/test_comparison_mapping.cjs
          node tests/test_mapping_suggestions.cjs
          node tests/test_mapping_draft.cjs
          node tests/test_mapping_editor.cjs
          node tests/test_mapping_apply.cjs
          node tests/test_edition_groups.cjs
          node tests/test_browser_validation.cjs
          node tests/test_validation_paths.cjs
          node tests/test_validation_source.cjs
          node tests/test_validation_messages.cjs
          node tests/test_validation_navigation.cjs
      - name: Import verified SourceCraft WSDL snapshots
        run: python sourcecraft_pull.py
      - name: Collect both contours and validate candidate
        env:
          SEDO_SFR_POLITE: '1'
        run: |
          python auto_update.py
          node tests/test_browser_validation.cjs --all-editions
      - name: Commit validated data and deploy
        run: |
          git add state data site
          if ! git diff --cached --quiet; then
            git commit -m "Update SFR specifications and check status"
            git push origin HEAD:main
          fi
          # GITHUB_TOKEN pushes do not trigger the Pages push workflow.
          # Explicit dispatch also retries deployment after a previous Pages failure.
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          head = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          Path('publication-target.json').write_text(json.dumps(dict(update_run_id=os.environ['GITHUB_RUN_ID'], head_sha=head)), encoding='utf-8')
          PY
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: Write update summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = Path("update-report.json")
          if report.exists():
              r = json.loads(report.read_bytes())
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf8") as f:
                  f.write("## SFR update\n\n")
                  f.write("~~~json\n" + json.dumps(r, ensure_ascii=False, indent=2) + "\n~~~\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sfr-update-report
          path: |
            update-report.json
            sourcecraft-report.json
            publication-target.json
          if-no-files-found: ignore
          retention-days: 30

