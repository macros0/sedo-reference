name: Check SFR catalogs
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reference-main
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema extraction dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test history preservation and update failures
        run: |
          python -m unittest discover -s tests -v
          node tests/test_compare.cjs
          node tests/test_update_summaries.cjs
          node tests/test_journal_dates.cjs
          node tests/test_transitions.cjs
          node tests/test_viewer_sections.cjs
          node tests/test_cross_message_compare.cjs
      - name: Collect both contours and validate candidate
        run: python auto_update.py
      - name: Commit validated data and deploy
        run: |
          git add state data site
          if ! git diff --cached --quiet; then
            git commit -m "Update SFR specifications and check status"
            git push origin HEAD:main
          fi
          # GITHUB_TOKEN pushes do not trigger the Pages push workflow.
          # Explicit dispatch also retries deployment after a previous Pages failure.
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: Write update summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = Path("update-report.json")
          if report.exists():
              r = json.loads(report.read_bytes())
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf8") as f:
                  f.write("## SFR update\n\n")
                  f.write("~~~json\n" + json.dumps(r, ensure_ascii=False, indent=2) + "\n~~~\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sfr-update-report
          path: update-report.json
          if-no-files-found: ignore
          retention-days: 30

