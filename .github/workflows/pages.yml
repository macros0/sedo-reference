name: Publish reference
run-name: ${{ inputs.update_run_id && format('Publish reference for check {0} attempt {1} at {2}', inputs.update_run_id, inputs.update_run_attempt, inputs.head_sha) || 'Publish reference' }}
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_run_id:
        description: Check SFR run requesting publication
        type: string
      update_run_attempt:
        description: Attempt of the Check SFR run
        type: string
      head_sha:
        description: Commit of the checked reference
        type: string
      catalog_sha256:
        description: SHA-256 of the checked public catalog
        type: string
permissions:
  contents: read
concurrency:
  group: reference-main
  queue: max
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}
      catalog_sha256: ${{ steps.candidate.outputs.catalog_sha256 }}
      artifact_name: ${{ steps.candidate.outputs.artifact_name }}
      artifact_id: ${{ steps.pages-artifact.outputs.artifact_id }}
    permissions:
      contents: write
    env:
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resume a validated import saved by this run
        id: resume-imports
        run: |
          git fetch --no-tags origin refs/heads/main
          saved=$(python publication_guard.py --resume-build "$GITHUB_SHA" "$(git rev-parse FETCH_HEAD)" "$GITHUB_RUN_ID")
          if [ -n "$saved" ]; then
            git checkout --detach "$saved"
          fi
          echo "sha=$saved" >> "$GITHUB_OUTPUT"
      - name: Install schema extraction dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Validate and apply pending Russian collector snapshots
        if: ${{ steps.resume-imports.outputs.sha == '' }}
        env:
          SEDO_SFR_POLITE: '1'
          SEDO_COLLECTOR_SOURCE: ${{ vars.SEDO_COLLECTOR_SOURCE || 'sourcecraft' }}
        run: python collector_snapshots.py
      - name: Import incoming specifications
        if: ${{ steps.resume-imports.outputs.sha == '' }}
        run: python import_inbox.py
      - name: Build the validated reference
        run: |
          python update_catalog.py --offline
          python verify.py
          python build_site.py
          node tests/test_browser_validation.cjs --all-editions
          node tests/test_attribute_ref_constraints.cjs --all-editions
          touch site/.nojekyll
      - name: Test generated candidate invariants
        run: |
          python -m unittest discover -s tests -q
          npm run test:node
      - name: Test built reference in Chromium
        run: npm run test:browser
      - name: Save browser test report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: browser-test-report-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 30
      - name: Save validated imports
        id: saved-imports
        env:
          RESUMED_SHA: ${{ steps.resume-imports.outputs.sha }}
        run: |
          base=$(git rev-parse HEAD)
          git add -- state data
          if [ -n "$RESUMED_SHA" ]; then
            test "$base" = "$RESUMED_SHA"
            git diff --cached --quiet
          elif ! git diff --cached --quiet; then
            git commit -m "Import specifications and validated collector snapshots" -m "SEDO-Pages-Run: $GITHUB_RUN_ID"
          fi
          candidate=$(git rev-parse HEAD)
          git fetch --no-tags origin refs/heads/main
          current=$(git rev-parse FETCH_HEAD)
          selected=$(python publication_guard.py --build-candidate "$base" "$candidate" "$current")
          if [ "$selected" != "$current" ]; then
            if ! git push origin HEAD:main; then
              git fetch --no-tags origin refs/heads/main
              current=$(git rev-parse FETCH_HEAD)
              selected=$(python publication_guard.py --build-candidate "$base" "$candidate" "$current")
              test "$selected" = "$current"
            fi
          fi
          echo "candidate_sha=$selected" >> "$GITHUB_OUTPUT"
          # The token push does not start another workflow. Publish this checked artifact below.
      - name: Record the validated artifact commit
        id: candidate
        env:
          CANDIDATE_SHA: ${{ steps.saved-imports.outputs.candidate_sha }}
        run: |
          echo "candidate_sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          echo "artifact_name=github-pages-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              print('catalog_sha256=' + hashlib.sha256(Path('site/catalog-data.js').read_bytes()).hexdigest(), file=output)
          PY
      - name: Write incoming report
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          report = Path("inbox-report.json")
          if report.exists():
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf8") as f:
                  f.write("## Incoming specifications\n\n~~~json\n" + report.read_text("utf8") + "\n~~~\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: incoming-import-report-${{ github.run_attempt }}
          path: inbox-report.json
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        id: pages-artifact
        with:
          path: site
          name: ${{ steps.candidate.outputs.artifact_name }}
          retention-days: 30
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record evidence for the requesting check
        if: ${{ inputs.update_run_id && inputs.update_run_attempt && inputs.head_sha && inputs.catalog_sha256 }}
        env:
          UPDATE_RUN_ID: ${{ inputs.update_run_id }}
          UPDATE_RUN_ATTEMPT: ${{ inputs.update_run_attempt }}
          CHECKED_SHA: ${{ inputs.head_sha }}
          CHECKED_CATALOG_SHA256: ${{ inputs.catalog_sha256 }}
          CANDIDATE_SHA: ${{ needs.build.outputs.candidate_sha }}
          CATALOG_SHA256: ${{ needs.build.outputs.catalog_sha256 }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          receipt = {key.lower(): os.environ[key] for key in (
              'UPDATE_RUN_ID', 'UPDATE_RUN_ATTEMPT', 'CHECKED_SHA', 'CHECKED_CATALOG_SHA256',
              'CANDIDATE_SHA', 'CATALOG_SHA256', 'ARTIFACT_NAME', 'ARTIFACT_ID')}
          receipt.update(pages_run_id=os.environ['GITHUB_RUN_ID'], pages_run_attempt=os.environ['GITHUB_RUN_ATTEMPT'])
          Path('publication-receipt.json').write_text(json.dumps(receipt), encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.update_run_id && inputs.update_run_attempt && inputs.head_sha && inputs.catalog_sha256 }}
        continue-on-error: true
        with:
          name: pages-publication-receipt-${{ github.run_attempt }}
          path: publication-receipt.json
          retention-days: 30
      - name: Reject a stale artifact against current main
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.build.outputs.candidate_sha }}
        run: python publication_guard.py "$CANDIDATE_SHA"
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
  refresh-status:
    needs: [build, deploy]
    # A status-service outage must not change the result of the deployment.
    continue-on-error: true
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Refresh the public status after publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for pause in 0 5 15; do
            sleep "$pause"
            if gh workflow run automation-status.yml --repo "$GITHUB_REPOSITORY" --ref main -f publication_run_id="$GITHUB_RUN_ID" -f publication_run_attempt="$GITHUB_RUN_ATTEMPT"; then
              exit 0
            fi
          done
          echo "::warning::Could not dispatch the public status refresh for Pages run $GITHUB_RUN_ID"
          exit 1
