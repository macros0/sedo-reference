name: Refresh automatic update status
on:
  workflow_dispatch:
    inputs:
      publication_run_id:
        description: Pages run finishing the deployment
        type: string
        required: false
      publication_run_attempt:
        description: Attempt of the Pages run finishing deployment
        type: string
        required: false
  schedule:
    - cron: '5 4 * * *'
  workflow_run:
    workflows: [Check SFR catalogs, Publish reference]
    types: [requested, in_progress, completed]
    branches: [main]
permissions:
  contents: write
  actions: read
concurrency:
  group: automation-status
  cancel-in-progress: false
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Only trusted default-branch code runs, never code or scripts from artifacts.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish independent public status
        env:
          SEDO_COLLECTOR_SOURCE: ${{ vars.SEDO_COLLECTOR_SOURCE || 'sourcecraft' }}
          CHECK_RUN_ID: ${{ github.event.workflow_run.name == 'Check SFR catalogs' && github.event.workflow_run.id || '' }}
          CHECK_RUN_ATTEMPT: ${{ github.event.workflow_run.name == 'Check SFR catalogs' && github.event.workflow_run.run_attempt || '' }}
          PUBLICATION_RUN_ATTEMPT: ${{ inputs.publication_run_attempt || (github.event.workflow_run.name == 'Publish reference' && github.event.workflow_run.run_attempt) || '' }}
          PUBLICATION_RUN_ID: ${{ inputs.publication_run_id || (github.event.action == 'completed' && github.event.workflow_run.name == 'Publish reference' && github.event.workflow_run.id) || '' }}
        run: python automation_status.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automation-status-report
          path: automation-status-report.json
          if-no-files-found: ignore
          retention-days: 30
